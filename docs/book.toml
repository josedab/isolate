[book]
title = "Isolate Documentation"
authors = ["Isolate Contributors"]
description = "Documentation for the Isolate secure sandbox runtime"
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/josedab/isolate"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/josedab/isolate/edit/main/docs/{path}"
site-url = "/isolate/"
cname = ""
input-404 = "404.md"

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = true
runnable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-headers = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[preprocessor.links]

[preprocessor.index]
