[package]
name = "isolate-core"
description = "Secure sandbox runtime for executing untrusted WebAssembly code with capability-based security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["wasm", "sandbox", "security", "isolation", "webassembly"]
categories = ["wasm", "web-programming"]

[features]
default = []

# Optional module groups (compile only what you need)
pool = []                # Warm sandbox pool with predictive autoscaling
networking = ["dep:url"]          # HTTP client and network policy modules
agent = []               # AI agent framework for tool-using sandboxes
policy-engine = []       # Policy rules engine, audit logging, composition, policy language
platform = [              # All platform sub-features (meta-feature)
    "dep:serde_yaml",
    "platform-admin",
    "platform-storage",
    "platform-workflow",
    "platform-marketplace",
    "platform-comm",
    "platform-hosting",
    "platform-infra",
]
platform-admin = ["dep:serde_yaml"]       # Admin, gateway, orchestrator
platform-storage = ["dep:serde_yaml"]     # KV store, sandbox KV, VFS, secrets
platform-workflow = ["dep:serde_yaml"]    # Workflows, workflow engine, pipelines
platform-marketplace = ["dep:serde_yaml"] # Marketplace, plugins, provenance
platform-comm = ["dep:serde_yaml"]        # IPC, RPC, GraphQL schema
platform-hosting = ["dep:serde_yaml"]     # Serverless, playground, SaaS
platform-infra = ["dep:serde_yaml"]       # Infrastructure as code
observability = []       # Dashboard, tracing context, WASM analytics
billing = []             # Billing and cloud cost tracking
deployment = []          # Autoscale, deploy, hot reload, module/OCI registry
federation = []          # Federation and geo-replication

# Core experimental features
snapshots = ["dep:async-trait"]  # Snapshot/restore functionality with copy-on-write memory
wasi-preview2 = []       # WASI Preview2 (Component Model) support
debug-support = []       # Live debugging with breakpoints and time-travel
module-signing = []      # Cryptographic signing and verification of WASM modules

# Advanced/optional features
kubernetes = ["dep:serde_yaml"]  # Kubernetes operator and CRD support
otel-telemetry = [       # OpenTelemetry distributed tracing
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
ai-detection = []        # AI-powered anomaly detection for sandbox behavior
nlp-policies = []        # Natural language policy definition
extras = []              # AI exec, carbon tracking, enclave, JS runtime, OS security, verification

# Experimental features (not production ready)
hotpatch = []            # Hot code patching (simulated, not production ready)
distributed-mesh = []    # Distributed sandbox execution (network stubs)
gpu-compute = []         # GPU acceleration (simulated)
chaos-testing = []       # Chaos engineering and fault injection

# Meta features
experimental = [
    "hotpatch",
    "distributed-mesh",
    "gpu-compute",
    "chaos-testing",
]
full = [
    "pool",
    "networking",
    "agent",
    "policy-engine",
    "platform",
    "extras",
    "observability",
    "billing",
    "deployment",
    "federation",
    "snapshots",
    "wasi-preview2",
    "debug-support",
    "module-signing",
    "kubernetes",
    "otel-telemetry",
    "ai-detection",
    "nlp-policies",
    "experimental",
]

[dependencies]
# WASM runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }

# Error handling
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# OpenTelemetry (optional, enabled by otel-telemetry feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Metrics
prometheus = { workspace = true }

# Utilities (optional where only needed by feature-gated modules)
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
uuid = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
wat = "1.219"

[[bench]]
name = "sandbox"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "capability_io"
harness = false

[[bench]]
name = "coldstart"
harness = false

[[bench]]
name = "pre_initialized"
harness = false
