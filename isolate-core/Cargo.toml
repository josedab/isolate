[package]
name = "isolate-core"
description = "Secure sandbox runtime for executing untrusted WebAssembly code with capability-based security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["wasm", "sandbox", "security", "isolation", "webassembly"]
categories = ["wasm", "web-programming"]

[features]
default = []

# ── Optional module groups (compile only what you need) ──────────────────────

## Warm sandbox pool with predictive autoscaling for reusing pre-compiled modules.
pool = []
## HTTP client and network policy modules for outbound requests from sandboxes.
networking = ["dep:url"]
## AI agent framework for tool-using sandboxes with structured I/O.
agent = []
## Policy rules engine with audit logging, composition, and a policy language.
policy-engine = []
## All platform sub-features combined (admin, storage, workflow, marketplace, comm, hosting, infra).
platform = [
    "dep:serde_yaml",
    "platform-admin",
    "platform-storage",
    "platform-workflow",
    "platform-provenance",
    "platform-comm",
    "platform-hosting",
    "platform-infra",
]
## Admin dashboard, API gateway, and multi-tenant orchestrator.
platform-admin = ["dep:serde_yaml"]
## Embedded key-value store, virtual filesystem, and secrets management.
platform-storage = ["dep:serde_yaml"]
## Workflow orchestration engine and multi-sandbox pipelines.
platform-workflow = ["dep:serde_yaml"]
## Module provenance and supply-chain tracking.
platform-provenance = ["dep:serde_yaml"]
## Inter-sandbox IPC, RPC framework, and GraphQL schema generation.
platform-comm = ["dep:serde_yaml"]
## Serverless function adapters, web playground, and SaaS multi-tenancy.
platform-hosting = ["dep:serde_yaml"]
## Infrastructure as code provider support (Terraform, Pulumi).
platform-infra = ["dep:serde_yaml"]
## Standalone serverless adapter (OpenFaaS, Knative, Fission, AWS SAM).
serverless = []
## Observability dashboard, distributed tracing context, and WASM analytics.
observability = []
## Multi-tenant billing, metering, and cloud cost optimization.
billing = []
## Auto-scaling, deployment planner, hot reload, and module/OCI registries.
deployment = []
## Federated module registry with geo-replication and automatic failover.
federation = []

# ── Experimental features ────────────────────────────────────────────────────

## Copy-on-write snapshot/restore for sub-millisecond warm starts.
snapshots = ["dep:async-trait"]
## WASI Preview 2 (Component Model) support for next-gen WASM components.
wasi-preview2 = []
## Live debugging with breakpoints, stepping, and time-travel replay.
debug-support = []
## Cryptographic signing and verification of WASM modules.
module-signing = []

# ── Advanced/optional features ───────────────────────────────────────────────

## Kubernetes operator with CRD support and Helm chart generation.
kubernetes = ["dep:serde_yaml"]
## OpenTelemetry distributed tracing and metrics export.
otel-telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
## AI-powered anomaly detection for sandbox behavior analysis.
ai-detection = []
## Natural language policy definition using NLP parsing.
nlp-policies = []
## AI execution sandbox, carbon tracking, enclave support, JS runtime, OS security, and verification.
extras = []

# ── Experimental features (not production ready) ────────────────────────────

## Hot code patching for live module updates (simulated, not production ready).
hotpatch = []
## Distributed sandbox mesh for multi-node execution (network stubs only).
distributed-mesh = []
## GPU acceleration for compute-intensive WASM workloads (simulated).
gpu-compute = []
## Chaos engineering and fault injection for resilience testing.
chaos-testing = []

# ── Meta features ────────────────────────────────────────────────────────────

## Enable all experimental features (hotpatch, distributed-mesh, gpu-compute, chaos-testing).
experimental = [
    "hotpatch",
    "distributed-mesh",
    "gpu-compute",
    "chaos-testing",
]
## Enable every feature. Useful for generating complete documentation.
full = [
    "pool",
    "networking",
    "agent",
    "policy-engine",
    "platform",
    "extras",
    "observability",
    "billing",
    "deployment",
    "federation",
    "serverless",
    "snapshots",
    "wasi-preview2",
    "debug-support",
    "module-signing",
    "kubernetes",
    "otel-telemetry",
    "ai-detection",
    "nlp-policies",
    "experimental",
]

[dependencies]
# WASM runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }

# Error handling
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# OpenTelemetry (optional, enabled by otel-telemetry feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Metrics
prometheus = { workspace = true }

# Utilities (optional where only needed by feature-gated modules)
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
uuid = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
wat = "1.219"

[[bench]]
name = "sandbox"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "capability_io"
harness = false
required-features = ["extras"]

[[bench]]
name = "coldstart"
harness = false

[[bench]]
name = "pre_initialized"
harness = false
