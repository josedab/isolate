[package]
name = "isolate-core"
description = "Secure sandbox runtime for executing untrusted WASM code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["wasm", "sandbox", "isolation", "security", "runtime"]
categories = ["wasm", "development-tools"]

[features]
default = []

# Core experimental features
snapshots = []           # Snapshot/restore functionality with copy-on-write memory
wasi-preview2 = []       # WASI Preview2 (Component Model) support
debug-support = []       # Live debugging with breakpoints and time-travel
module-signing = []      # Cryptographic signing and verification of WASM modules

# Advanced/optional features
kubernetes = []          # Kubernetes operator and CRD support
otel-telemetry = []      # OpenTelemetry distributed tracing
ai-detection = []        # AI-powered anomaly detection for sandbox behavior
nlp-policies = []        # Natural language policy definition

# Experimental features (not production ready)
hotpatch = []            # Hot code patching (simulated, not production ready)
distributed-mesh = []    # Distributed sandbox execution (network stubs)
gpu-compute = []         # GPU acceleration (simulated)
chaos-testing = []       # Chaos engineering and fault injection

# Meta features
experimental = [
    "hotpatch",
    "distributed-mesh",
    "gpu-compute",
    "chaos-testing",
]
full = [
    "snapshots",
    "wasi-preview2",
    "debug-support",
    "module-signing",
    "kubernetes",
    "otel-telemetry",
    "ai-detection",
    "nlp-policies",
    "experimental",
]

[dependencies]
# WASM runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Metrics
prometheus = { workspace = true }

# Utilities
uuid = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }

# HTTP client
reqwest = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"

[[bench]]
name = "sandbox"
harness = false

[[bench]]
name = "engine"
harness = false
