[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "isolate-sandbox"
version = "0.1.0"
description = "Python bindings for Isolate - secure WebAssembly sandbox runtime"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [
    { name = "Isolate Contributors" }
]
keywords = ["wasm", "webassembly", "sandbox", "security", "isolation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/example/isolate"
Repository = "https://github.com/example/isolate"
Documentation = "https://github.com/example/isolate#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "isolate._isolate"
