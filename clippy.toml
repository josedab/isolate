# Clippy configuration for Isolate
# https://doc.rust-lang.org/clippy/configuration.html

# Minimum Supported Rust Version
msrv = "1.75.0"

# Cognitive complexity threshold for functions
cognitive-complexity-threshold = 25

# Maximum number of lines in a function body
too-many-lines-threshold = 150

# Maximum number of arguments in a function
too-many-arguments-threshold = 7

# Type complexity threshold
type-complexity-threshold = 250

# Documentation requirements - allow docs on private items to be optional
missing-docs-in-crate-items = false

# Disallowed methods (security-sensitive)
disallowed-methods = [
    { path = "std::env::set_var", reason = "Use capability system for environment access" },
    { path = "std::env::remove_var", reason = "Use capability system for environment access" },
]

# Allow certain patterns that are common in this codebase
allow-unwrap-in-tests = true
