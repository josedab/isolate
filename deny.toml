# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Exclude development and build dependencies from checks
exclude-dev = false

[advisories]
# The database path (default uses cargo's advisory-db)
db-path = "~/.cargo/advisory-db"
# The URL of the advisory database
url = "https://github.com/rustsec/advisory-db"
# How often to fetch the database
fetch = "always"
# Ignore specific advisories (if needed)
ignore = []

[licenses]
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# Licenses that are considered copyleft
copyleft = "deny"
# Blanket approval or denial for OSI-approved licenses
allow-osi-fsf-free = "either"
# Lint level for licenses that don't fall into the other categories
default = "deny"
# The confidence threshold for detecting a license
confidence-threshold = 0.8

# Exceptions for specific crates
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c }
]

[bans]
# Lint level for duplicate crates
multiple-versions = "warn"
# Lint level for crates that use wildcards
wildcards = "allow"
# Lint level for crates that are dev-only duplicates
highlight = "all"
# Allow specific duplicate versions if needed
skip = []
# Skip dependency trees from certain root crates
skip-tree = []

# Deny specific crates
deny = [
    # Example: unsafe or problematic crates
    # { name = "some-crate", reason = "Security issue" }
]

# Allow specific crates that would otherwise be denied
allow = []

[sources]
# Lint level for crates from unknown registries
unknown-registry = "deny"
# Lint level for crates from unknown git repositories
unknown-git = "warn"
# List of trusted git repositories
allow-git = []

# Trusted registries
[sources.allow-registry]
# Only allow crates from crates.io by default
# Add additional registries here if needed

[output]
# Whether to use features like colors in the output
feature-depth = 1
