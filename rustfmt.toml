# Rustfmt configuration for Isolate
# https://rust-lang.github.io/rustfmt/
#
# This configuration uses only stable options.
# For nightly-only options, see the commented section below.

edition = "2021"
max_width = 100
use_small_heuristics = "Max"
newline_style = "Unix"
reorder_imports = true
reorder_modules = true

# Unstable options (require nightly rustfmt)
# Uncomment these if using nightly:
#
# imports_granularity = "Module"
# group_imports = "StdExternalCrate"
# format_code_in_doc_comments = true
# format_macro_matchers = true
# wrap_comments = true
# normalize_comments = true
# normalize_doc_attributes = true
# comment_width = 100
# hex_literal_case = "Upper"
