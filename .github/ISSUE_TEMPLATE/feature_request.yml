name: Feature Request
description: Suggest a new feature for Isolate
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out the information below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Is your feature request related to a problem?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "I would like Isolate to..."
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API (Optional)
      description: If applicable, show how you imagine the API would look.
      render: rust
      placeholder: |
        let sandbox = Sandbox::create(config)
            .with_new_feature()
            .build()?;

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I also considered..."

  - type: dropdown
    id: impact
    attributes:
      label: Impact Area
      description: Which area of Isolate would this feature affect?
      options:
        - Core sandbox functionality
        - WASI implementation
        - Security / Capabilities
        - Performance
        - CLI tool
        - Python bindings
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change
      description: Would this feature require breaking changes to existing APIs?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues/discussions to make sure this hasn't been requested
          required: true
        - label: I am willing to help implement this feature
          required: false
