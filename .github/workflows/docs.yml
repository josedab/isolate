name: Documentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-
            ${{ runner.os }}-cargo-

      - name: Build Rust documentation
        run: |
          RUSTDOCFLAGS="--enable-index-page -Z unstable-options" \
          cargo +nightly doc --no-deps --all-features --workspace
        continue-on-error: true

      - name: Build Rust documentation (stable fallback)
        if: failure()
        run: cargo doc --no-deps --all-features --workspace

      - name: Create index.html redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=isolate_core/index.html">' > target/doc/index.html

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Generate README badges
  badges:
    name: Update Badges
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Count lines of code
        id: loc
        run: |
          if command -v tokei &> /dev/null; then
            LOC=$(tokei --output json | jq '.Rust.code // 0')
          else
            LOC=$(find . -name '*.rs' -exec cat {} + | wc -l)
          fi
          echo "loc=$LOC" >> $GITHUB_OUTPUT

      - name: Count tests
        id: tests
        run: |
          TESTS=$(cargo test --workspace --all-features -- --list 2>/dev/null | grep -c 'test$' || echo "0")
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

      - name: Generate badge data
        run: |
          echo "Lines of Code: ${{ steps.loc.outputs.loc }}"
          echo "Tests: ${{ steps.tests.outputs.tests }}"

  # API docs version tracking
  versions:
    name: Document Versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get versions from tags
        run: |
          echo "# Released Versions" > VERSIONS.md
          echo "" >> VERSIONS.md
          git tag -l 'v*' --sort=-version:refname | head -10 | while read tag; do
            echo "- $tag" >> VERSIONS.md
          done
          echo "" >> VERSIONS.md
          echo "Latest: $(git describe --tags --abbrev=0 2>/dev/null || echo 'No releases yet')" >> VERSIONS.md
          cat VERSIONS.md
